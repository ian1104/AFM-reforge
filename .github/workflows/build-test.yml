name: build-test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AFMReforge.sln

      - name: Build
        run: dotnet build AFMReforge.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test AFMReforge.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
